# Netlify build and proxy configuration
[build]
  # Use npm --prefix to run commands inside react-app
  command = "npm ci && npm run build --prefix react-app"
  publish = "react-app/dist"

# Proxy /api/* to your backend. Replace YOUR_BACKEND_DOMAIN with your backend URL (no trailing slash).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_DOMAIN/:splat"
  status = 200
  force = true
