<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Berlin Restaurant - Desserts</title>
  <link rel="stylesheet" href="./fonts/remixicon.css">
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/nav.css">
  <link rel="stylesheet" href="./styles/footer.css" />
  <link rel="stylesheet" href="dishpage.css" />
</head>
<body>

  <!-- ✅ Navbar Start -->
  <div class="nav">
    <nav>
      <a href="/" class="logo-text">Modern Berlin Restaurant</a>
      <input type="checkbox" id="check" />
      <label for="check" class="checkbtn">
        <i class="ri-menu-line"></i>
      </label>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/breakfast">Breakfast</a></li>
        <li><a href="/Fastfood">Fast Food</a></li>
        <li><a href="/dessert" class="active">Dessert</a></li>
        <li><a href="/main-dish">Main Dish</a></li>
        <li><a href="/cart">Cart</a></li>
      </ul>
    </nav>
  </div>
  <!-- ✅ Navbar End -->

  <div class="toast-container" id="toastContainer"></div>

  <!-- ✅ Dish Cards Container -->
  <div id="dish-container"></div>

  <footer>
    <section id="section7">
      <div class="footer"></div>
    </section>
  </footer>

  <a href="/cart" class="floating-cart hidden" id="floatingCart">
    <i class="ri-shopping-cart-line"></i>
    <span class="cart-count" id="cartCount">0</span>
  </a>

  <script>
    localStorage.setItem("selectedCategory", "Dessert");
    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const badge = document.getElementById('floatingCart');
      const count = document.getElementById('cartCount');
      if (badge && count) {
        if (cart.length > 0) {
          count.textContent = cart.length;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }
    document.addEventListener('DOMContentLoaded', updateCartBadge);
    window.addEventListener('storage', updateCartBadge);
  </script>
  <script src="./dishPage.js"></script>
  <script src="./script.js" defer></script>
</body>
</html>
