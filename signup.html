<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modern Berlin Restaurant - Sign Up</title>
  <link rel="stylesheet" href="./fonts/remixicon.css">
  <link rel="stylesheet" href="./styles/global.css" />
  <style>
    body {
      font-family: var(--font-primary);
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-primary);
      margin: 0;
      padding: 20px;
      position: relative;
    }
    .back-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 15px;
      transition: color var(--transition-fast);
    }
    .back-btn:hover {
      color: var(--accent);
    }
    .signup-container {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--glass-border);
      animation: scaleIn 0.5s var(--ease-out) both;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 14px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      box-sizing: border-box;
      background: var(--bg-surface);
      color: var(--text-primary);
      outline: none;
      font-size: 15px;
      transition: all var(--transition-fast);
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(212, 168, 67, 0.2);
    }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none;
      border-radius: var(--radius-full);
      color: var(--bg-primary);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 168, 67, 0.3);
    }
    .error {
      color: #EF4444;
      margin-top: 12px;
      font-size: 14px;
      display: none;
      text-align: center;
      font-weight: 500;
    }
    .link-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .link-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .link-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create Account</h2>
    <p class="subtitle">Join us to order delicious meals</p>
    <form id="signupForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="John Smith" />

      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="john@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" required placeholder="••••••••" />

      <button type="submit">Sign Up</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="link-text">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>

  <script>
    const API_BASE = `${window.location.origin}/api`;
    const signupForm = document.getElementById("signupForm");
    const errorMsg = document.getElementById("errorMsg");

    signupForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      errorMsg.style.display = "none";

      if (!name || !email || !password || !confirmPassword) {
        errorMsg.textContent = "All fields are required!";
        errorMsg.style.display = "block";
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match!";
        errorMsg.style.display = "block";
        return;
      }

      fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ name, email, password }),
      })
      .then(async (response) => {
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success) {
          alert('Sign Up successful! You can now log in.');
          window.location.href = '/login';
        } else {
          errorMsg.textContent = data.message || 'Registration failed.';
          errorMsg.style.display = 'block';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        errorMsg.textContent = 'An error occurred during registration.';
        errorMsg.style.display = 'block';
      });
    });
  </script>
</body>
</html>
